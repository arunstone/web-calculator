services:
  nginx:
    image: nginx:1.27-alpine
    container_name: local-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      - spr

  backend:
    build:
      context: .
      dockerfile: backend.dockerfile
    container_name: local-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: REMOVED_SECRET
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: super-secret-key-change-me
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      MAX_QUEUE_SIZE: 100
      CELERY_WORKER_CONCURRENCY: 4
    networks:
      - spr

  worker:
    build:
      context: .
      dockerfile: backend.dockerfile
    container_name: local-worker
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: REMOVED_SECRET
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: super-secret-key-change-me
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      MAX_QUEUE_SIZE: 100
      CELERY_WORKER_CONCURRENCY: 4
    command: ["sh", "-c", "uv run celery -A backend.tasks worker --loglevel=info -Q calculator --concurrency=${CELERY_WORKER_CONCURRENCY:-4}"]
    networks:
      - spr

  postgres:
    image: postgres:16
    container_name: local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: REMOVED_SECRET
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spr

  redis:
    image: redis:7-alpine
    container_name: local-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - spr

volumes:
  postgres_data:

networks:
  spr:
    name: spr
